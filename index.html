<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Intelligence Scanner</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --green: #00d4a0;
    --red: #ff4d6d;
    --orange: #ff9f1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; direction: rtl; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 16px; font-weight: 700; color: var(--green); letter-spacing: 1px; }
  .logo span { color: var(--text); }

  .main { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }

  .toolbar { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .tb-group { display: flex; flex-direction: column; gap: 4px; }
  .tb-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; padding: 6px 10px; outline: none; cursor: pointer; }
  input[type=range] { width: 100px; accent-color: var(--green); }
  .vol-val { color: var(--green); font-weight: 600; }
  .btn-scan { padding: 8px 24px; background: var(--green); color: #000; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
  .btn-scan:disabled { opacity: .4; cursor: default; }

  .status-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 6px 0; min-height: 28px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section { margin-bottom: 16px; }
  .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .layer-badge { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .section-title { font-size: 13px; font-weight: 600; }
  .section-sub { font-size: 11px; color: var(--muted); margin-right: auto; }

  .sector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .sector-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; position: relative; overflow: hidden; }
  .sector-chip.hot { border-color: var(--red); }
  .sector-chip.warm { border-color: var(--orange); }
  .chip-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .chip-etf { font-size: 10px; color: var(--muted); }
  .chip-chg { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .chip-flow { font-size: 10px; margin-top: 2px; }
  .chip-bar { height: 2px; margin-top: 6px; border-radius: 1px; background: var(--border); overflow: hidden; }
  .chip-bar-fill { height: 100%; border-radius: 1px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .table-wrap { overflow-x: auto; }
  .stock-table { width: 100%; border-collapse: collapse; }
  .stock-table th { font-size: 10px; color: var(--muted); padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); font-weight: 500; white-space: nowrap; }
  .stock-table td { padding: 9px 10px; border-bottom: 1px solid rgba(42,42,58,.5); font-size: 12px; white-space: nowrap; }
  .stock-table tr:hover td { background: var(--surface2); cursor: pointer; }
  .stock-table tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
  .badge-hot { background: rgba(255,77,109,.15); color: var(--red); border: 1px solid rgba(255,77,109,.3); }
  .badge-warm { background: rgba(255,159,28,.15); color: var(--orange); border: 1px solid rgba(255,159,28,.3); }
  .badge-ok { background: rgba(0,212,160,.15); color: var(--green); border: 1px solid rgba(0,212,160,.3); }

  .score-wrap { display: flex; align-items: center; gap: 6px; }
  .score-bg { width: 50px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 2px; }

  .cat-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; }
  .cat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cat-headline { font-size: 11px; color: var(--muted); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kw-tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 99px; background: rgba(0,212,160,.1); color: var(--green); border: 1px solid rgba(0,212,160,.25); margin: 2px 2px 0 0; }

  .scores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .score-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px; cursor: pointer; }
  .score-card:hover { border-color: var(--muted); }
  .score-big { font-size: 30px; font-weight: 700; line-height: 1; }
  .score-symbol { font-size: 14px; font-weight: 600; margin-top: 5px; }
  .score-meta { font-size: 10px; color: var(--muted); margin-top: 3px; }

  .detail-panel { background: var(--surface); border: 1px solid var(--green); border-radius: 12px; padding: 18px; margin-top: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat-box { background: var(--surface2); border-radius: 8px; padding: 10px; text-align: center; }
  .stat-val { font-size: 16px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .btn-close { padding: 6px 14px; font-size: 12px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">MARKET<span>INTEL</span> 🔭</div>
  <div style="font-size:11px;color:var(--muted)" id="hst">מוכן לסריקה</div>
</div>

<div class="main">
  <div class="toolbar">
    <div class="tb-group">
      <span class="tb-label">סקטור</span>
      <select id="ssel">
        <option value="all">כל הסקטורים</option>
        <option value="XLK">Technology (XLK)</option>
        <option value="XLV">Healthcare (XLV)</option>
        <option value="XLE">Energy (XLE)</option>
        <option value="SOXX">Semiconductors (SOXX)</option>
        <option value="ITA">Defense (ITA)</option>
        <option value="XBI">Biotech (XBI)</option>
        <option value="XLF">Financial (XLF)</option>
        <option value="XLY">Consumer (XLY)</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Volume Surge מינימום: <span class="vol-val" id="vout">2x</span></span>
      <input type="range" id="vr" min="1" max="4" step="1" value="2">
    </div>
    <div class="tb-group">
      <span class="tb-label">תוצאות</span>
      <select id="mr"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option></select>
    </div>
    <button class="btn-scan" id="sbtn" onclick="startScan()">⚡ SCAN NOW</button>
  </div>

  <div class="status-bar" id="sta"></div>
  <div class="section" id="l1" style="display:none">
    <div class="section-header"><span class="layer-badge">LAYER 1</span><span class="section-title">Sector Heat Map</span><span class="section-sub">איפה הכסף זורם</span></div>
    <div class="sector-grid" id="l1c"></div>
  </div>
  <div class="section" id="l2" style="display:none">
    <div class="section-header"><span class="layer-badge">LAYER 2</span><span class="section-title">Stock Scanner</span><span class="section-sub" id="l2cnt"></span></div>
    <div class="card"><div class="table-wrap"><table class="stock-table">
      <thead><tr><th>#</th><th>סימול</th><th>שם</th><th>מחיר</th><th>שינוי %</th><th>Vol Surge</th><th>Cap</th><th>52W</th><th>Score</th><th>קטליסט</th></tr></thead>
      <tbody id="l2t"></tbody>
    </table></div></div>
  </div>
  <div id="dp"></div>
  <div class="section" id="l3" style="display:none">
    <div class="section-header"><span class="layer-badge">LAYER 3</span><span class="section-title">Catalyst Detector</span><span class="section-sub">קטליסטים לפני הפיצוץ</span></div>
    <div id="l3c"></div>
  </div>
  <div class="section" id="l4" style="display:none">
    <div class="section-header"><span class="layer-badge">LAYER 4</span><span class="section-title">Explosion Score — Top Picks</span></div>
    <div class="scores-grid" id="l4c"></div>
  </div>
</div>

<script>
const VL={1:'1.5x',2:'2x',3:'3x',4:'5x'};
const VV={1:1.5,2:2,3:3,4:5};
const SECS=[
  {etf:'XLK',name:'Technology',    stocks:['NVDA','MSFT','AAPL','META','AVGO','AMD','ORCL','CRM','ADBE','QCOM']},
  {etf:'XLV',name:'Healthcare',    stocks:['LLY','UNH','JNJ','ABBV','MRK','TMO','ABT','DHR','AMGN','ISRG']},
  {etf:'XLE',name:'Energy',        stocks:['XOM','CVX','COP','EOG','SLB','MPC','PSX','VLO','OXY','HAL']},
  {etf:'SOXX',name:'Semiconductors',stocks:['NVDA','AMD','AVGO','QCOM','AMAT','LRCX','KLAC','MRVL','ON','MPWR']},
  {etf:'ITA',name:'Defense',       stocks:['RTX','LMT','NOC','GD','BA','HII','LDOS','CACI','SAIC','TDG']},
  {etf:'XBI',name:'Biotech',       stocks:['MRNA','REGN','VRTX','BIIB','ALNY','INCY','BMRN','EXEL','ITCI','RCKT']},
  {etf:'XLF',name:'Financial',     stocks:['JPM','BAC','WFC','GS','MS','BLK','AXP','SCHW','USB','PNC']},
  {etf:'XLY',name:'Consumer',      stocks:['AMZN','TSLA','HD','MCD','NKE','SBUX','LOW','TGT','BKNG','CMG']}
];
const KW=['partnership','collaboration','agreement','deal','fda','contract','awarded','acquisition','merger','approval','license','breakthrough','milestone','launch','wins','expands'];
let DATA=[];

document.getElementById('vr').addEventListener('input',function(){document.getElementById('vout').textContent=VL[this.value];});

async function fmp(path){
  const res=await fetch(`/api/fmp?path=${encodeURIComponent(path)}`);
  if(!res.ok) throw new Error('API '+res.status);
  const d=await res.json();
  if(d&&d['Error Message']) throw new Error(d['Error Message']);
  return d;
}

function setStatus(m,sp=false){
  document.getElementById('sta').innerHTML=m?`<div class="status-bar">${sp?'<div class="spinner"></div>':''}${m}</div>`:'';
  document.getElementById('hst').textContent=m||'מוכן';
}

function sc(s){return s>=75?'var(--red)':s>=50?'var(--orange)':'var(--green)';}
function capStr(c){if(!c)return'—';if(c>=1e12)return(c/1e12).toFixed(1)+'T';if(c>=1e9)return(c/1e9).toFixed(1)+'B';return(c/1e6).toFixed(0)+'M';}

async function startScan(){
  document.getElementById('sbtn').disabled=true;
  ['l1','l2','l3','l4'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('dp').innerHTML='';
  DATA=[];
  const sel=document.getElementById('ssel').value;
  const vm=VV[document.getElementById('vr').value];
  const mr=parseInt(document.getElementById('mr').value);
  const secs=sel==='all'?SECS:SECS.filter(s=>s.etf===sel);
  try{
    await doL1(secs);
    await doL2(secs,vm,mr);
    await doL3();
    doL4();
  }catch(e){setStatus('❌ שגיאה: '+e.message);}
  document.getElementById('sbtn').disabled=false;
  setStatus('');
}

async function doL1(secs){
  setStatus('Layer 1 — טוען סקטורים...',true);
  let quotes=[];
  try{
    // New FMP stable API for batch quotes
    const symbols=secs.map(s=>s.etf).join(',');
    quotes=await fmp(`/batch-quote?symbols=${symbols}`);
  }catch(e){}
  const qm={};
  (Array.isArray(quotes)?quotes:[]).forEach(q=>qm[q.symbol]=q);
  let html='';
  secs.forEach(s=>{
    const q=qm[s.etf]||{};
    const chg=q.changesPercentage||q.change||0;
    const vol=q.volume||0,avg=q.avgVolume||q.averageVolume||1;
    const surge=avg>0?vol/avg:0;
    const hot=surge>=1.5&&chg>0,warm=!hot&&(surge>=1.2||chg>0.5);
    const bc=hot?'var(--red)':warm?'var(--orange)':'var(--green)';
    const cc=chg>=0?'var(--green)':'var(--red)';
    html+=`<div class="sector-chip ${hot?'hot':warm?'warm':''}">
      <div class="chip-name">${s.name}</div>
      <div class="chip-etf">${s.etf}</div>
      <div class="chip-chg" style="color:${cc}">${chg>=0?'+':''}${Number(chg).toFixed(2)}%</div>
      <div class="chip-flow">${hot?'<span style="color:var(--red);font-weight:700">💰 MONEY IN</span>':warm?'<span style="color:var(--orange)">↑ warming</span>':'<span style="color:var(--muted)">neutral</span>'}</div>
      <div class="chip-bar"><div class="chip-bar-fill" style="width:${Math.min(100,surge*35)}%;background:${bc}"></div></div>
    </div>`;
  });
  document.getElementById('l1c').innerHTML=html;
  document.getElementById('l1').style.display='block';
}

async function doL2(secs,vm,mr){
  setStatus('Layer 2 — סורק מניות...',true);
  const all=[...new Set(secs.flatMap(s=>s.stocks))];
  let quotes=[];
  for(let i=0;i<all.length;i+=20){
    try{
      const chunk=all.slice(i,i+20).join(',');
      const d=await fmp(`/batch-quote?symbols=${chunk}`);
      if(Array.isArray(d))quotes=quotes.concat(d);
    }catch(e){}
  }
  DATA=quotes.map(q=>{
    const surge=(q.volume||0)/(q.avgVolume||q.averageVolume||1);
    const chg=q.changesPercentage||q.change||0;
    const cap=q.marketCap||0;
    const w52=q.yearHigh>0?Math.round((q.price-q.yearLow)/(q.yearHigh-q.yearLow)*100):50;
    const sb=cap<500e6?20:cap<2e9?12:cap<10e9?6:0;
    const score=Math.min(100,Math.round(Math.min(35,surge*7)+Math.min(25,Math.abs(chg)*4)+Math.min(15,w52*.15)+sb+5));
    return{...q,surge,score,w52pos:Math.max(0,Math.min(100,w52)),chg,catalysts:0,catNews:[]};
  }).filter(q=>q.surge>=vm).sort((a,b)=>b.score-a.score).slice(0,mr);

  const tbody=document.getElementById('l2t');
  tbody.innerHTML=DATA.map((q,i)=>{
    const cc=q.chg>=0?'var(--green)':'var(--red)';
    const s=q.score,bc=sc(s);
    const bd=s>=75?'badge-hot':s>=50?'badge-warm':'badge-ok';
    return`<tr onclick="showDetail(${i})">
      <td style="color:var(--muted)">${i+1}</td>
      <td style="font-weight:700;font-size:13px">${q.symbol}</td>
      <td style="color:var(--muted);font-size:11px">${(q.name||'').substring(0,20)}</td>
      <td style="font-weight:600">$${Number(q.price||0).toFixed(2)}</td>
      <td style="color:${cc};font-weight:600">${q.chg>=0?'+':''}${Number(q.chg).toFixed(2)}%</td>
      <td><span class="badge ${bd}">${q.surge.toFixed(1)}x</span></td>
      <td style="color:var(--muted)">${capStr(q.marketCap)}</td>
      <td><div style="width:50px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden"><div style="width:${q.w52pos}%;height:100%;background:linear-gradient(90deg,var(--green),var(--orange));border-radius:2px"></div></div></td>
      <td><div class="score-wrap"><span style="font-weight:700;color:${bc}">${s}</span><div class="score-bg"><div class="score-fill" style="width:${s}%;background:${bc}"></div></div></div></td>
      <td id="cat-${q.symbol}"><span style="color:var(--muted)">—</span></td>
    </tr>`;
  }).join('');
  document.getElementById('l2cnt').textContent=`${DATA.length} מניות נמצאו`;
  document.getElementById('l2').style.display='block';
}

async function doL3(){
  if(!DATA.length)return;
  setStatus('Layer 3 — מחפש קטליסטים...',true);
  let html='';
  for(const stock of DATA.slice(0,8)){
    try{
      const news=await fmp(`/stock-news?symbols=${stock.symbol}&limit=10`);
      if(!Array.isArray(news)||!news.length)continue;
      const found=[];
      news.forEach(n=>{
        const txt=((n.title||'')+(n.text||'')).toLowerCase();
        const hits=KW.filter(k=>txt.includes(k));
        if(hits.length)found.push({headline:n.title,kws:hits});
      });
      if(!found.length)continue;
      const idx=DATA.findIndex(x=>x.symbol===stock.symbol);
      if(idx>=0){DATA[idx].catalysts=found.reduce((a,f)=>a+f.kws.length,0);DATA[idx].catNews=found;}
      const el=document.getElementById('cat-'+stock.symbol);
      if(el)el.innerHTML=`<span class="kw-tag">🔥 ${DATA[idx].catalysts}</span>`;
      const s=stock.score,bd=s>=75?'badge-hot':s>=50?'badge-warm':'badge-ok';
      html+=`<div class="cat-item"><div class="cat-header"><span style="font-weight:700;font-size:14px">${stock.symbol}</span><span class="badge ${bd}">${s}</span><span style="color:var(--muted);font-size:11px">${found.length} catalysts</span></div>`;
      found.slice(0,2).forEach(f=>{html+=`<div style="margin-bottom:5px"><div class="cat-headline">${f.headline}</div><div>${f.kws.map(k=>`<span class="kw-tag">${k}</span>`).join('')}</div></div>`;});
      html+='</div>';
    }catch(e){}
  }
  document.getElementById('l3c').innerHTML=html||'<div style="color:var(--muted);padding:10px">לא נמצאו קטליסטים</div>';
  document.getElementById('l3').style.display='block';
}

function doL4(){
  if(!DATA.length)return;
  const html=[...DATA].sort((a,b)=>b.score-a.score).slice(0,10).map(s=>{
    const c=sc(s.score);
    return`<div class="score-card" onclick="showDetail(${DATA.indexOf(s)})">
      <div class="score-big" style="color:${c}">${s.score}</div>
      <div class="score-symbol">${s.symbol}</div>
      <div class="score-meta">${s.surge.toFixed(1)}x · ${s.chg>=0?'+':''}${Number(s.chg).toFixed(1)}%</div>
      <div style="font-size:9px;color:${c};font-weight:700;margin-top:4px">${s.score>=75?'EXPLOSIVE':s.score>=50?'HOT':'WARM'}</div>
      ${s.catalysts>0?`<div style="margin-top:4px"><span class="kw-tag">🔥 ${s.catalysts}</span></div>`:''}
    </div>`;
  }).join('');
  document.getElementById('l4c').innerHTML=html;
  document.getElementById('l4').style.display='block';
}

async function showDetail(i){
  const s=DATA[i];if(!s)return;
  const el=document.getElementById('dp');
  el.innerHTML=`<div class="detail-panel"><div class="status-bar"><div class="spinner"></div>טוען פרטים עבור ${s.symbol}...</div></div>`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
  let p={};
  try{const pr=await fmp(`/profile?symbol=${s.symbol}`);if(Array.isArray(pr)&&pr[0])p=pr[0];}catch(e){}
  const c=sc(s.score),cc=s.chg>=0?'var(--green)':'var(--red)';
  el.innerHTML=`<div class="detail-panel">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <div><div style="font-size:20px;font-weight:700">${s.symbol} ${s.score>=75?'<span style="color:var(--red)">EXPLOSIVE</span>':s.score>=50?'<span style="color:var(--orange)">HOT</span>':''}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">${p.companyName||s.name||''} · ${p.sector||''} · ${p.exchange||''}</div></div>
      <div style="text-align:left"><div style="font-size:34px;font-weight:700;color:${c}">${s.score}</div><div style="font-size:10px;color:var(--muted)">EXPLOSION SCORE</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val">$${Number(s.price||0).toFixed(2)}</div><div class="stat-lbl">מחיר</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${cc}">${s.chg>=0?'+':''}${Number(s.chg).toFixed(2)}%</div><div class="stat-lbl">שינוי יומי</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--red)">${s.surge.toFixed(1)}x</div><div class="stat-lbl">Volume Surge</div></div>
      <div class="stat-box"><div class="stat-val">${capStr(s.marketCap)}</div><div class="stat-lbl">Market Cap</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" style="font-size:13px">$${Number(s.yearLow||0).toFixed(2)}</div><div class="stat-lbl">52W Low</div></div>
      <div class="stat-box"><div class="stat-val" style="font-size:13px">$${Number(s.yearHigh||0).toFixed(2)}</div><div class="stat-lbl">52W High</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${c}">${s.w52pos}%</div><div class="stat-lbl">מיקום שנתי</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--green)">${s.catalysts}</div><div class="stat-lbl">Catalysts</div></div>
    </div>
    ${p.description?`<div style="font-size:11px;color:var(--muted);line-height:1.7;margin:10px 0">${p.description.substring(0,300)}...</div>`:''}
    ${s.catNews&&s.catNews.length?`<div style="margin-top:10px">${s.catNews.slice(0,2).map(n=>`<div style="margin-bottom:6px"><div class="cat-headline">${n.headline}</div><div>${n.kws.map(k=>`<span class="kw-tag">${k}</span>`).join('')}</div></div>`).join('')}</div>`:''}
    <button class="btn-close" onclick="document.getElementById('dp').innerHTML=''">✕ סגור</button>
  </div>`;
}
</script>
</body>
</html>
